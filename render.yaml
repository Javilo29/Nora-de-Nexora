services:
  - type: web
    name: Nora-de-Nexora
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/ia_app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false # Mantener la que ya se puso manualmente
